# Umwandlung eines hochgeladenen Videos in die Abspielfassung (1080p, H.264, SDR).
# Angestoßen vom Worker per workflow_dispatch (src/routes/processing.js), nicht von Hand.
# Die eigentliche Arbeit macht scripts/process-video.sh (lokal testbar).
#
# Secrets (Repo → Settings → Secrets and variables → Actions):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  eigener R2-Token, nur Bucket formation-videos (Lesen + Schreiben)
#   CALLBACK_SECRET                         gleicher Wert wie das Worker-Secret CALLBACK_SECRET
name: Video umwandeln

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Video-ID
        required: true
        type: string
      storage_key:
        description: Original in R2 (raw/<id>.<ext>)
        required: true
        type: string

# Nie zwei Jobs für dasselbe Video gleichzeitig (z. B. Wiederholung, während der erste noch läuft)
concurrency:
  group: video-${{ inputs.video_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # neuere AWS-CLI-Versionen senden Prüfsummen, mit denen R2 nicht immer zurechtkommt
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2: https://527266f78a5c7ffa288f4a9d2c49e842.eu.r2.cloudflarestorage.com
      BUCKET: formation-videos
      API: https://formation.nils-meier.de/api/internal/processed
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      # Eingaben nur über env, nie direkt per ${{ }} in run-Blöcke (Script-Injection)
      ID: ${{ inputs.video_id }}
      KEY: ${{ inputs.storage_key }}
    steps:
      - name: Eingaben prüfen
        run: |
          [[ "$ID"  =~ ^[0-9a-f-]{36}$ ]] || { echo "ungültige ID"; exit 1; }
          [[ "$KEY" =~ ^raw/[0-9a-f-]{36}\.[a-z0-9]{2,4}$ ]] || { echo "ungültiger Key"; exit 1; }

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: ffmpeg holen
        run: |
          # statisches Build mit zscale (für HDR → SDR); sonst das von Ubuntu
          if curl -fsSL -o ff.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
             && mkdir ff && tar xf ff.tar.xz -C ff --strip-components=1 \
             && ff/bin/ffmpeg -hide_banner -filters | grep -q " zscale "; then
            echo "$PWD/ff/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Original holen
        run: aws s3 cp "s3://$BUCKET/$KEY" "in.${KEY##*.}" --endpoint-url "$R2" --no-progress

      - name: Umwandeln
        run: |
          ffmpeg -version | head -1
          RESULT=$(bash scripts/process-video.sh "in.${KEY##*.}" out thumb)
          echo "$RESULT"
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"

      - name: Zurück nach R2
        run: |
          aws s3 cp out/play.mp4  "s3://$BUCKET/play/$ID.mp4"  --endpoint-url "$R2" --content-type video/mp4 --no-progress
          aws s3 cp out/thumb.jpg "s3://$BUCKET/thumb/$ID.jpg" --endpoint-url "$R2" --content-type image/jpeg --no-progress

      - name: Worker benachrichtigen
        run: |
          BODY=$(jq -c --arg id "$ID" '. + {id: $id, status: "done"}' <<< "$RESULT")
          curl -fsS --retry 3 -X POST "$API" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY"

      - name: Fehler melden
        # failure() allein greift nicht, wenn der Job am Timeout abgebrochen wird
        if: failure() || cancelled()
        run: |
          curl -fsS --retry 3 -X POST "$API" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$ID\",\"status\":\"failed\"}"
