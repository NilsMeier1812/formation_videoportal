<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8">
  <meta name="robots" content="noindex, nofollow">
  <title>Hochladen · Formation</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/upload.js"></script>
</head>
<body class="page">
  <header class="app-bar">
    <h1>Hochladen</h1>
    <button class="icon-btn" id="theme" type="button"></button>
  </header>
  <main class="narrow">
    <p id="checking" class="muted">Einen Moment …</p>

    <section id="login" class="card login-card" hidden>
      <p>Zum Hochladen einmal den <strong>Gruppen-Code</strong> eingeben – der Browser merkt sich die Anmeldung ein Jahr lang.</p>
      <form id="login-form" class="fields">
        <label class="field">Gruppen-Code
          <input id="code" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary block" type="submit">Weiter</button>
        <p id="login-message" class="message" role="status"></p>
      </form>
    </section>

    <section id="upload" hidden>
      <div class="signed-in">
        <span id="signed-in-as">Angemeldet</span>
        <button class="link" id="logout" type="button">Abmelden</button>
      </div>

      <form id="form" class="card fields">
        <label class="dropzone" id="dropzone">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
          <strong id="drop-title">Videos auswählen</strong>
          <span id="drop-sub">Mehrere auf einmal gehen</span>
          <input id="files" type="file" accept="video/*" multiple required>
        </label>

        <div class="row">
          <label class="field">Dein Name
            <input id="name" type="text" maxlength="50" autocomplete="given-name" required>
          </label>
          <label class="field">Aufgenommen am
            <input id="date" type="date" required>
          </label>
        </div>
        <div class="row">
          <label class="field">Kamera / Perspektive
            <input id="camera" type="text" maxlength="50" list="cameras" placeholder="z. B. vorne">
            <datalist id="cameras">
              <option value="vorne"><option value="hinten"><option value="links"><option value="rechts"><option value="oben">
            </datalist>
          </label>
          <label class="field">Titel
            <input id="title" type="text" maxlength="200" placeholder="optional – sonst Dateiname">
          </label>
        </div>

        <label class="switch">
          <input id="noChoreo" type="checkbox">
          <span class="track"></span>
          Gehört zu keiner Choreo (z. B. Technik-Erklärung, fremder Auftritt)
        </label>

        <button id="submit" class="primary block" type="submit">Hochladen</button>
        <p class="muted" style="margin:0;font-size:13px">Während des Uploads Bildschirm anlassen und die Seite nicht verlassen.</p>
        <p id="message" class="message" role="status"></p>
      </form>

      <ul id="uploads" class="uploads"></ul>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Bereiche">
    <a href="/choreo/">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      Choreo
    </a>
    <a href="/">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></span>
      Videos
    </a>
    <a href="/upload" aria-current="page">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg></span>
      Hochladen
    </a>
  </nav>
</body>
</html>
