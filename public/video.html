<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8">
  <meta name="robots" content="noindex, nofollow">
  <title>Video · Formation</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/video.js"></script>
</head>
<body class="page">
  <header class="app-bar">
    <a class="icon-btn back" href="/" aria-label="Zurück zur Videothek">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 id="title">Video</h1>
    <button class="icon-btn" id="theme" type="button"></button>
  </header>
  <main class="narrow">
    <p id="status" class="muted">Lade …</p>

    <div id="player" class="player" hidden>
      <video id="video" controls playsinline preload="metadata"></video>

      <div class="controls">
        <div class="seg" role="group" aria-label="Tempo">
          <button type="button" data-rate="0.25" aria-pressed="false">0,25×</button>
          <button type="button" data-rate="0.5" aria-pressed="false">0,5×</button>
          <button type="button" data-rate="0.75" aria-pressed="false">0,75×</button>
          <button type="button" data-rate="1" aria-pressed="true">1×</button>
        </div>
        <button type="button" id="mirror" class="toggle" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7 3 12l5 5z"/><path d="m16 7 5 5-5 5z"/></svg>
          Spiegeln
        </button>
      </div>

      <p id="processing" class="notice" hidden>
        Wird noch aufbereitet – bis dahin läuft die Originaldatei. iPhone-Videos spielen
        auf manchen Geräten erst nach der Aufbereitung.
      </p>

      <dl id="facts" class="facts card"></dl>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="Bereiche">
    <a href="/choreo/">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      Choreo
    </a>
    <a href="/" aria-current="page">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></span>
      Videos
    </a>
    <a href="/upload">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg></span>
      Hochladen
    </a>
  </nav>
</body>
</html>
