name = "formation-portal"
main = "src/index.js"
compatibility_date = "2026-08-15"
account_id = "527266f78a5c7ffa288f4a9d2c49e842"

# Ausgeliefert wird nur über die eigene Domain, nicht über *.workers.dev
workers_dev = false
preview_urls = false
routes = [{ pattern = "formation.nils-meier.de", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# API und Medien immer an den Worker, alles andere zuerst als statische Datei
run_worker_first = ["/api/*", "/media/*"]
# Die App ist eine Seite: /videos, /upload … (alles ohne eigene Datei) liefert index.html
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "formation-portal"
database_id = "a339958c-c739-4cc2-807f-da7170bf082c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "formation-videos"
jurisdiction = "eu"

[vars]
R2_S3_ENDPOINT = "https://527266f78a5c7ffa288f4a9d2c49e842.eu.r2.cloudflarestorage.com"
BUCKET_NAME = "formation-videos"
MEDIA_BASE_URL = "/media"            # Videos/Bilder über den Worker (nur für Angemeldete)
QUOTA_BYTES = "200000000000"     # 200 GB
MAX_FILE_BYTES = "5000000000"    # 5 GB
GH_REPO = "NilsMeier1812/formation_videoportal"  # Umwandlung: .github/workflows/process-video.yml

# Zeitgesteuerte Aufgaben (src/cron.js), Zeiten in UTC:
#   stündlich: abgebrochene Uploads aufräumen, Umwandlung wiederholen
#   täglich 03:33: Papierkorb nach 30 Tagen leeren, Originale 7 Tage nach der Umwandlung löschen
[triggers]
crons = ["17 * * * *", "33 3 * * *"]

# Schutz gegen Code-Raten: höchstens 10 Anmeldeversuche pro Minute und IP
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Secrets (nicht hier eintragen, sondern `npx wrangler secret put <NAME>`):
#   GROUP_CODE, TAGGER_CODE, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   GH_TOKEN (Umwandlung anstoßen), CALLBACK_SECRET (Rückmeldung der Umwandlung)
